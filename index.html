<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14121c">
  <title>狐火行</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14121c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #game { position: fixed; inset: 0; }
    #game canvas { image-rendering: pixelated; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #14121c; color: #f2e6c9;
      font: 500 18px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">請把手機轉成橫向來玩《狐火行》</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
